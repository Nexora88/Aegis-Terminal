<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Aegis Terminal</title><style>body{margin:0;background:#070a09;color:#e9f4ee;font-family:system-ui;padding:28px}main{max-width:1200px;margin:auto}header{display:flex;justify-content:space-between;border-bottom:1px solid #1d2a26;padding-bottom:18px}h1{letter-spacing:.12em}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0}.card{background:#0c1110;border:1px solid #1d2a26;border-radius:10px;padding:20px}.value{font-size:28px;color:#6cff9b;margin-top:8px}.muted{color:#81958a;font-size:11px;letter-spacing:.12em}.panel{background:#0c1110;border:1px solid #1d2a26;border-radius:10px;padding:20px;margin:14px 0}pre{white-space:pre-wrap;color:#9fb4a7}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main><header><div><div class='muted'>NEXORA // DEFENSIVE OPERATIONS</div><h1>AEGIS TERMINAL</h1></div><div id='status'>● ONLINE</div></header><div class='grid'><div class='card'><div class='muted'>CPU</div><div id='cpu' class='value'>--</div></div><div class='card'><div class='muted'>MEMORY</div><div id='mem' class='value'>--</div></div><div class='card'><div class='muted'>DISK</div><div id='disk' class='value'>--</div></div><div class='card'><div class='muted'>RISK</div><div id='risk' class='value'>--</div></div></div><section class='panel'><div class='muted'>SYSTEM</div><pre id='system'>Loading...</pre></section><section class='panel'><div class='muted'>TOP PROCESSES</div><pre id='processes'>Loading...</pre></section></main><script>async function j(u){return (await fetch(u)).json()}async function refresh(){let s=await j('/api/system'),r=await j('/api/assessment'),p=await j('/api/processes');cpu.textContent=s.cpu_percent+'%';mem.textContent=s.memory_percent+'%';disk.textContent=s.disk_percent+'%';risk.textContent=r.risk_level+' / '+r.score;system.textContent=JSON.stringify(s,null,2);processes.textContent=JSON.stringify(p,null,2)}refresh();setInterval(refresh,5000)</script></body></html>
